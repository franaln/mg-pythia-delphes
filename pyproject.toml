[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mg-pythia-delphes"
dynamic = ["version"]
description = "Reproducible MadGraph, Pythia and Delphes workflows with local containers and HTCondor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
configuration = ["ruamel.yaml>=0.18.17,<0.19"]
validation = ["uproot>=5,<6"]
dev = ["build>=1,<2", "uproot>=5,<6", "ruamel.yaml>=0.18.17,<0.19"]

[project.scripts]
mgpd = "mgpd.cli:main"

[project.urls]
Repository = "https://github.com/franaln/mg-pythia-delphes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mgpd._version.__version__"}

[tool.setuptools.package-data]
mgpd = ["data/config_templates/*.yml", "data/cards/*.dat"]
