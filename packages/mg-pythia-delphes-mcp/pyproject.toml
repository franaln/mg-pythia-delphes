[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mg-pythia-delphes-mcp"
version = "0.2.0"
description = "Per-user MCP adapter for the MadGraph/Pythia/Delphes workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mg-pythia-delphes>=0.2.0,<0.3", "mcp>=2.3,<3"]

[project.scripts]
mgpd-mcp = "mgpd_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
