name: Build and Upload Container Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'data/**'
      - 'scripts/create_images.py'
      - '.dockerignore'
      - '.github/workflows/build-singularity.yml'
  workflow_dispatch:

jobs:
  build-singularity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed source lock
        run: |
          test -s images/sources.lock.json || {
            echo '::error::Generate, review and commit images/sources.lock.json before running this workflow.'
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer apptainer-suid
      - name: Build and check OCI and SIF images
        run: |
          python3 scripts/create_images.py --version 3.5.6 --engine docker \
            --repository ghcr.io/franaln/mg-pythia-delphes --build --sif --check
      - uses: actions/upload-artifact@v4
        with:
          name: mgpd-3.5.6-images
          path: dist/images/mg-pythia-delphes-3.5.6.sif*
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked OCI image
        run: |
          python3 scripts/create_images.py --version 3.5.6 --engine docker \
            --repository ghcr.io/franaln/mg-pythia-delphes --check --push
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/images/mg-pythia-delphes-3.5.6.sif*
          tag_name: image-3.5.6-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
